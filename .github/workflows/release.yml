# Builds Velody and publishes a GitHub Release whenever a version tag is pushed:
#
#   pnpm version patch     # 1.1.0 -> 1.1.1 (bumps package.json, commits, tags v1.1.1)
#   git push --follow-tags
#
# The AppImage, .deb and latest-linux.yml are uploaded to the release only
# after scripts/verify-asar.mjs confirms the package is complete; installed
# copies of the app pick it up on their next launch (src/main/updater.ts).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload assets

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"; exit 1
          fi

      - run: pnpm test

      - name: Build installers
        run: pnpm build && pnpm exec electron-builder --linux --publish never

      # Fails the release if electron-builder dropped a runtime dependency
      # from app.asar (v1.1.0 shipped without `ms` and crashed on launch).
      - name: Verify app.asar has every runtime dependency
        run: node scripts/verify-asar.mjs dist/linux-unpacked/resources/app.asar

      - name: Publish GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.AppImage dist/*.deb dist/latest-linux.yml \
            --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
