appId: com.velody.app
productName: velody
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,*.tsbuildinfo}'
  # Local dev-only content that must never ship in the package: separated
  # song stems are user data written under the project root during `pnpm dev`
  # (hundreds of MB+), not app code — bundling them bloated the installer by
  # ~800MB. python-worker is already provided via extraResources below, so
  # excluding it here avoids shipping it twice.
  - '!output/**'
  - '!python-worker/**'
  - '!.claude/**'
  - '!.pytest_cache/**'
  - '!openspec/**'
  - '!docs/**'
  - '!vitest.config.ts'
  - '!{AGENTS.md,CLAUDE.md,MOBILE_APP.md,OPTIMIZATION_PLAN.md}'
asarUnpack:
  - resources/**
extraResources:
  - from: python-worker
    to: python-worker
win:
  executableName: velody
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # AppImage auto-updates silently; .deb auto-updates too but asks for the
  # admin password (it's a system package). Both are published per release.
  target:
    - AppImage
    - deb
  maintainer: Hector Paramo <130419379+Hector0122@users.noreply.github.com>
  category: AudioVideo
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Auto-update source (src/main/updater.ts). CI (.github/workflows/release.yml)
# uploads the installers + latest*.yml here on every `v*` tag. releaseType
# must be `release`: the updater ignores drafts.
publish:
  provider: github
  owner: Hector0122
  repo: velody
  releaseType: release
