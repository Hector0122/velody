appId: com.velody.app
productName: velody
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,*.tsbuildinfo}'
  # Local dev-only content that must never ship in the package: separated
  # song stems are user data written under the project root during `pnpm dev`
  # (hundreds of MB+), not app code — bundling them bloated the installer by
  # ~800MB. python-worker is already provided via extraResources below, so
  # excluding it here avoids shipping it twice.
  - '!output/**'
  - '!python-worker/**'
  - '!.claude/**'
  - '!.pytest_cache/**'
  - '!openspec/**'
  - '!docs/**'
  - '!vitest.config.ts'
  - '!{AGENTS.md,CLAUDE.md,MOBILE_APP.md,OPTIMIZATION_PLAN.md}'
asarUnpack:
  - resources/**
extraResources:
  - from: python-worker
    to: python-worker
win:
  executableName: velody
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
